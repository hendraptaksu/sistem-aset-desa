name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # PENTING: better-sqlite3@13 segfault (0xC0000005) di new Database()
          # pada Node 20 / 22 lama (upstream WiseLibs/better-sqlite3#1514).
          # Node 24 = sama dengan dev lokal (terbukti 47/47 hijau).
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error

      - name: Upload ke GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
